# k8s/ingress/api-ingress.yaml

# ============ PUBLIC ROUTES ============
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-public-exceptions
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/priority: "100"
spec:
  rules:
    - host: api.local.dev
      http:
        paths:
          - path: /api/v1/auth/login
            pathType: Exact
            backend:
              service:
                name: user-service
                port:
                  number: 80

          - path: /api/v1/auth/register
            pathType: Exact
            backend:
              service:
                name: user-service
                port:
                  number: 80

          - path: /api/v1/auth/refresh
            pathType: Exact
            backend:
              service:
                name: user-service
                port:
                  number: 80

          - path: /users/health
            pathType: Exact
            backend:
              service:
                name: user-service
                port:
                  number: 80
          - path: /products/health
            pathType: Exact
            backend:
              service:
                name: product-service
                port:
                  number: 80

---
# ============ PRIVATE ROUTES ============
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-protected-catchall
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/priority: "10"
    nginx.ingress.kubernetes.io/auth-url: "http://user-service.default.svc.cluster.local/api/v1/auth/validate"
    nginx.ingress.kubernetes.io/auth-method: GET
    nginx.ingress.kubernetes.io/auth-response-headers: "X-User-ID,X-User-Role"
spec:
  rules:
    - host: api.local.dev
      http:
        paths:
          - path: /api/v1/users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 80
          - path: /api/v1/products
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 80

          - path: /api/v1/categories
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 80
          - path: /api/v1/
            pathType: Prefix
            backend:
              service:
                name: user-service # Default service
                port:
                  number: 80
